# 部分设置涉及密钥，因此不上传，请自行填写
spring:
  application:
    name: yuan-ai-code-screenshot
  profiles:
    active: local
server:
  port: 8773
  servlet:
    context-path: /yuan
# Dubbo
dubbo:
  registry:
    address: nacos://127.0.0.1:8848?username=nacos&password=nacos
    register-mode: instance
  protocol:
    name: tri
    port: 50053
  consumer:
    timeout: 60000
  provider:
    timeout: 60000
  # QOS 配置 - 为每个服务设置不同的端口
  application:
    qos-port: 22221
    qos-enable: true

