spring:
  application:
    name: yuan-ai-code-producer
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yuan-ai-code-producer?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  profiles:
    active: local
  # 后端 session 配置 redis
  session:
    store-type: redis
    # 30 天过期
    timeout: 2592000
server:
  port: 8700
  servlet:
    # 设置访问前缀
    context-path: /ai
    # 前端 cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
# http://localhost:8700/yuan/doc.html
springdoc:
  group-configs:
    - group: "default"
      paths-to-match:
        - '/**'
      packages-to-scan:
        - 'com.yuan.yuanaicodeproducer.controller'
# knife4j的增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn